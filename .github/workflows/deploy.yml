name: Deploy API

on:
  push:
    branches: [cloud-models]
    paths: [api/**, .github/workflows/deploy.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_KEYS: ${{ secrets.API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
      - name: Upload API_KEYS secret
        if: env.API_KEYS != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          secrets: |
            API_KEYS
      - name: Warn if API_KEYS missing
        if: env.API_KEYS == ''
        run: echo "::warning::API_KEYS secret not set - every /v1 request will return 401 until you add it and re-run."
