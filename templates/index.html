<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing with MLX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }

    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }

    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f2ff;
    }

    .upload-area.dragover {
      border-color: #764ba2;
      background: #e8ebff;
    }

    .upload-icon {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 15px;
    }

    .upload-text {
      color: #666;
      font-size: 16px;
    }

    .upload-subtext {
      color: #999;
      font-size: 14px;
      margin-top: 5px;
    }

    #fileInput {
      display: none;
    }

    .preview-container {
      margin-top: 30px;
      display: none;
    }

    .preview-image {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .process-btn {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .process-btn:hover {
      transform: translateY(-2px);
    }

    .process-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .response-container {
      margin-top: 30px;
      display: none;
    }

    .response-title {
      color: #333;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .response-text {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 10px;
      color: #444;
      line-height: 1.6;
      border-left: 4px solid #667eea;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #666;
      font-size: 14px;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
      border-left: 4px solid #c33;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🖼️ Image Processing</h1>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">Click to upload or drag and drop</div>
      <div class="upload-subtext">PNG, JPG, JPEG, GIF, WEBP (Max 16MB)</div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp">
    </div>

    <div class="preview-container" id="previewContainer">
      <img id="previewImage" class="preview-image" alt="Preview">
      <button class="process-btn" id="processBtn">Process Image</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Processing image with MLX model...</div>
    </div>

    <div class="response-container" id="responseContainer">
      <div class="response-title">📝 Analysis Result:</div>
      <div class="response-text" id="responseText"></div>
    </div>

    <div class="error-message" id="errorMessage"></div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const processBtn = document.getElementById('processBtn');
    const loading = document.getElementById('loading');
    const responseContainer = document.getElementById('responseContainer');
    const responseText = document.getElementById('responseText');
    const errorMessage = document.getElementById('errorMessage');

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFile(file);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        handleFile(file);
      }
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        previewContainer.style.display = 'block';
        uploadArea.style.display = 'none';
        responseContainer.style.display = 'none';
        errorMessage.style.display = 'none';
      };
      reader.readAsDataURL(file);
      currentFile = file;
    }

    let currentFile = null;

    processBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      const formData = new FormData();
      formData.append('image', currentFile);

      loading.style.display = 'block';
      processBtn.disabled = true;
      responseContainer.style.display = 'none';
      errorMessage.style.display = 'none';

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          responseText.textContent = data.response;
          responseContainer.style.display = 'block';
        } else {
          throw new Error(data.error || 'Processing failed');
        }
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        processBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
