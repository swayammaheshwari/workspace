<!doctype html>
<!-- "Did you know" stat-reveal template. Generated per-video by renderers/render_hyperframes.py,
     which substitutes the %%TOKEN%% placeholders below and overwrites demo/index.html. -->
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <title>%%CLASS_NAME%%</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: %%BG_COLOR%%; }

      #bg {
        position: absolute;
        inset: 0;
        background: %%BG_COLOR%%;
      }

      .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6%;
        font-family: Inter, system-ui, sans-serif;
        color: #f4f6fb;
      }

      #hook-inner {
        font-size: %%TEXT_FONT_SIZE%%px;
        font-weight: 800;
        line-height: 1.25;
        max-width: 85%;
      }

      #buildup-inner {
        font-size: %%BUILDUP_FONT_SIZE%%px;
        font-weight: 600;
        line-height: 1.35;
        max-width: 80%;
        color: #c9cedc;
      }

      #reveal-hold-inner {
        display: flex;
        align-items: baseline;
        justify-content: center;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: %%ACCENT_HEX%%;
        font-size: %%COUNT_FONT_SIZE%%px;
        text-shadow: 0 10px 40px color-mix(in srgb, %%ACCENT_HEX%% 24%, transparent);
      }

      #reveal-hold-inner .suffix {
        font-size: 0.55em;
        font-weight: 600;
        margin-left: 0.14em;
      }

      #source-inner {
        position: absolute;
        bottom: 6%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: %%SOURCE_FONT_SIZE%%px;
        font-weight: 500;
        color: #8891a8;
        font-family: Inter, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="%%TOTAL_DURATION%%"
      data-width="%%WIDTH%%"
      data-height="%%HEIGHT%%"
      data-fps="30"
    >
      <div id="bg"></div>

      <div id="hook" class="clip" data-start="0" data-duration="%%HOOK_DURATION%%" data-track-index="1">
        <div class="stack"><div id="hook-inner">%%HOOK_TEXT%%</div></div>
      </div>

      <div id="buildup" class="clip" data-start="%%BUILDUP_START%%" data-duration="%%BUILDUP_DURATION%%" data-track-index="1">
        <div class="stack"><div id="buildup-inner">%%BUILDUP_TEXT%%</div></div>
      </div>

      <!-- count-up's own internal animation is a fixed ~3s pop-in regardless of
           host duration, and goes blank once its own slot ends rather than
           holding — so it only covers the pop-in; #reveal-hold (below) takes
           over as a static clone for the rest of this beat's narration. -->
      <div
        id="reveal"
        data-composition-id="count-up"
        data-composition-src="compositions/components/count-up.html"
        data-start="%%REVEAL_START%%"
        data-duration="3"
        data-track-index="1"
        data-width="%%WIDTH%%"
        data-height="%%HEIGHT%%"
        data-variable-values='{"start": %%COUNT_START%%, "end": %%COUNT_END%%, "prefix": "%%COUNT_PREFIX%%", "suffix": "%%COUNT_SUFFIX%%", "accent": "%%COUNT_ACCENT%%", "glow": true, "exit": "none"}'
      ></div>

      <div id="reveal-hold" class="clip" data-start="%%REVEAL_HOLD_START%%" data-duration="%%REVEAL_HOLD_DURATION%%" data-track-index="1">
        <div class="stack">
          <div id="reveal-hold-inner">%%COUNT_END%%<span class="suffix">%%COUNT_SUFFIX%%</span></div>
        </div>
      </div>

      <div id="source" class="clip" data-start="%%REVEAL_START%%" data-duration="%%SOURCE_DURATION%%" data-track-index="2">
        <div id="source-inner">%%SOURCE_TEXT%%</div>
      </div>

      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-duration="%%TOTAL_DURATION%%"
        data-volume="1"
        src="assets/narration.mp3"
      ></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        tl.fromTo("#hook", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo(
          "#buildup",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          %%BUILDUP_START%%,
        );
        tl.fromTo(
          "#source",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          %%REVEAL_START%%,
        );
        tl.fromTo(
          "#reveal-hold",
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          %%REVEAL_HOLD_START%%,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
