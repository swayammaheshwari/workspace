[CLI]
# Base folder for intermediate build artifacts (Tex, texts, images, logs)
media_dir = .cache

# Final rendered videos go here, kept separate from intermediate artifacts
video_dir = videos/{module_name}/{quality}

# Partial movie files (per-animation chunks) go into the cache, not videos/
partial_movie_dir = .cache/partial_movie_files/{module_name}/{quality}/{scene_name}

# Sections (if --save_sections is ever used) also stay in the cache
sections_dir = .cache/sections/{module_name}/{quality}
